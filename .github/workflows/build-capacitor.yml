name: Build Capacitor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies & Tools
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/assets --legacy-peer-deps
          npm install -g javascript-obfuscator terser html-minifier-terser clean-css-cli

      - name: 1. Build & Obfuscate Web Assets
        run: bash scripts/build_assets.sh

      - name: 2. Add Android Platform & Generate Icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android

      - name: 3. Patch Android (Full Screen, Permissions, Performance)
        run: python3 scripts/patch_android.py

      - name: 4. Sync Web Assets to Android
        run: npx cap sync android

      - name: 5. Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
