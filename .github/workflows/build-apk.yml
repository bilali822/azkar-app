name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html style.css app.js manifest.json sw.js icons audio www/

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Patch build.gradle files to resolve Kotlin conflicts
        run: |
          cd android
          # 1. تعديل الملف الرئيسي (project-level build.gradle)
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.8.22'/" build.gradle
          # 2. تعديل ملف التطبيق (app-level build.gradle)
          cd app
          sed -i '/^dependencies {/i\\    configurations.all {\\n        resolutionStrategy {\\n            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\\n            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\\n        }\\n    }\\n' build.gradle

      - name: Sync Web Assets
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
